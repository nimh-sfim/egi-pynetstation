# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Use a currently supported Read the Docs image and a Python version that
# matches the version used by the documentation CI job.
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Install the same documentation dependencies used in CI, followed by the
# package itself so autodoc always documents the installed project accurately.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
